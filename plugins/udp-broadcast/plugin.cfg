[configuration]
id = "UDPBroadcast"
name = "UDP Event Broadcasting"
description = "Broadcasts game events via UDP for external controllers, displays, and monitoring tools"
author = "VPX dev team"
version = "1.0"
link = "https://github.com/vpinball/vpinball"

[libraries]
windows.x86 = "plugin-udp-broadcast.dll"
windows.x64 = "plugin-udp-broadcast64.dll"
linux.x64 = "plugin-udp-broadcast.so"
linux.aarch64 = "plugin-udp-broadcast.so"
macos.x64 = "plugin-udp-broadcast.dylib"
macos.arm64 = "plugin-udp-broadcast.dylib"
